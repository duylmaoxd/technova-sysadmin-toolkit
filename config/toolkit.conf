# =============================================================================
#  config/toolkit.conf — Cấu hình LinuxAdmin Toolkit cho máy chủ technova-core-srv
#  Cú pháp biến Bash: KHOÁ="giá trị" (không có dấu cách quanh dấu =).
#  Mỗi lần chạy lệnh, toolkit đọc lại file này — sửa xong là có hiệu lực ngay.
# =============================================================================

# ---- Doanh nghiệp ----
COMPANY_NAME="TechNova Solutions"
# Phòng ban = nhóm Linux (dev: lập trình viên, data: data analyst, qa: tester)
DEPARTMENTS="dev data qa"
# Thư mục dự án dùng chung theo phòng ban
SHARED_ROOT="/srv/technova"

# ---- Ngưỡng cảnh báo (%) — dùng bởi: alert check, monitor ----
CPU_THRESHOLD=80
MEM_THRESHOLD=85
DISK_THRESHOLD=90
# Một process "treo" ngốn tài nguyên: >= HOG_CPU % CPU hoặc >= HOG_MEM % RAM
HOG_CPU=90
HOG_MEM=30
# Số lần đăng nhập SSH thất bại trong 10 phút để coi là bị dò mật khẩu
SSH_FAIL_THRESHOLD=10
# Sau khi gửi cảnh báo, chờ bao nhiêu phút mới gửi lại (chống spam)
ALERT_COOLDOWN_MIN=30

# ---- Kênh nhận cảnh báo ----
# Email nhận cảnh báo (đặt nhanh bằng: sysadmin.sh alert setup-mail)
ALERT_EMAIL=""
# (Tuỳ chọn) gửi thêm qua Telegram: tạo bot với @BotFather để lấy token
TELEGRAM_BOT_TOKEN=""
TELEGRAM_CHAT_ID=""

# ---- Sao lưu (backup run) ----
# Các thư mục cần sao lưu, cách nhau dấu cách
BACKUP_SOURCES="/etc /home /srv/technova"
BACKUP_DEST="/var/backups/sysadmin-toolkit"
# Giữ lại bao nhiêu bản mới nhất
BACKUP_KEEP=7
BACKUP_EXCLUDES="*.tmp *.swp */.cache/*"
# (Tuỳ chọn) đẩy bản sao lưu sang máy khác bằng rsync, ví dụ "student@192.168.56.102:/srv/backup"
BACKUP_REMOTE=""

# ---- Người dùng & mật khẩu (users) ----
USERS_CSV="$TOOLKIT_DIR/config/users.csv"
DEFAULT_SHELL="/bin/bash"
# Mật khẩu hết hạn sau N ngày / phải dùng ít nhất N ngày / cảnh báo trước N ngày
PASS_MAX_DAYS=90
PASS_MIN_DAYS=1
PASS_WARN_AGE=7

# ---- SSH (đẩy bản sao lưu ra máy khác) ----
SSH_OPTS="-o ConnectTimeout=5 -o BatchMode=yes -o StrictHostKeyChecking=accept-new"

# ---- Lịch cron mặc định (scheduler install) ----
# 02:00 mỗi ngày / mỗi 5 phút / 07:00 thứ Hai hằng tuần
CRON_BACKUP="0 2 * * *"
CRON_CHECK="*/5 * * * *"
CRON_REPORT="0 7 * * 1"
# Bảo dưỡng hằng ngày lúc 03:30: dọn file tạm cũ hơn MAINT_TMP_DAYS ngày, giữ log journald MAINT_JOURNAL_KEEP
CRON_MAINT="30 3 * * *"
MAINT_TMP_DAYS=7
MAINT_JOURNAL_KEEP="30d"

# ---- Giao diện ----
# Khi chạy không tham số: ask (hỏi) | tui (giao diện) | cli (dòng lệnh)
DEFAULT_MODE="ask"
# Bộ vẽ giao diện: auto | dialog | whiptail
TUI_BACKEND="auto"
# Bỏ dấu tiếng Việt trong giao diện: auto (tự bật trên console tty) | 1 | 0
ASCII_MODE="auto"

# ---- Thư mục log & báo cáo (không ghi được thì tự dùng ~/.local/state/sysadmin-toolkit) ----
LOG_DIR="$TOOLKIT_DIR/logs"
REPORT_DIR="$TOOLKIT_DIR/reports"
